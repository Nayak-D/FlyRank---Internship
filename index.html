<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="DN Search Intelligence portfolio coming soon.">
    <meta name="theme-color" content="#176B87">
    <link rel="icon" href="assets/dn-monogram.png" type="image/png">
    <title>DN Search Intelligence</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Space+Grotesk:wght@500;600&display=swap');

        :root {
            --teal: #176B87;
            --ink: #17212B;
            --paper: #F7F8F5;
            --amber: #D99A2B;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: var(--paper);
            color: var(--ink);
            font-family: 'Source Sans 3', sans-serif;
        }

        main {
            width: min(680px, calc(100% - 48px));
            padding: 48px 0;
        }

        .mark {
            width: 56px;
            height: 56px;
            margin-bottom: 48px;
            border-radius: 8px;
            display: grid;
            place-items: center;
            background: var(--teal);
            color: var(--paper);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0;
        }

        p {
            max-width: 560px;
            margin: 0;
            font-size: 1.25rem;
            line-height: 1.45;
        }

        h1 {
            margin: 0 0 20px;
            color: var(--teal);
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(2.5rem, 8vw, 5.5rem);
            font-weight: 600;
            line-height: 0.98;
            letter-spacing: 0;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 48px;
            color: var(--ink);
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .status::before {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--amber);
            content: '';
        }
    </style>
</head>

<body>
    <main>
        <div class="mark" role="img" aria-label="DN monogram">DN</div>
        <h1>DN Search Intelligence</h1>
        <p>I turn messy search data into ranked, reviewable actions so teams can refresh the right content first.</p>
        <div class="status">Portfolio in progress</div>
    </main>
</body>

</html>
