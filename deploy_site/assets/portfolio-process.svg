<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Portfolio process: frame, score, validate, act</title>
  <desc id="desc">Four connected steps showing the content refresh ranking workflow.</desc>
  <rect width="1200" height="280" fill="#F7F8F5"/>
  <g font-family="Arial, sans-serif" fill="#17212B">
    <text x="60" y="48" font-size="16" font-weight="700" letter-spacing="2">CONTENT REFRESH WORKFLOW</text>
    <g transform="translate(60 88)">
      <rect width="220" height="120" rx="8" fill="#176B87"/>
      <text x="24" y="42" font-size="14" fill="#F7F8F5" font-weight="700">01</text>
      <text x="24" y="78" font-size="26" fill="#F7F8F5" font-weight="700">Frame</text>
      <text x="24" y="101" font-size="14" fill="#F7F8F5">Name the decision.</text>
    </g>
    <path d="M300 148h55" stroke="#D99A2B" stroke-width="4"/>
    <path d="m347 139 14 9-14 9" fill="none" stroke="#D99A2B" stroke-width="4"/>
    <g transform="translate(370 88)">
      <rect width="220" height="120" rx="8" fill="#17212B"/>
      <text x="24" y="42" font-size="14" fill="#F7F8F5" font-weight="700">02</text>
      <text x="24" y="78" font-size="26" fill="#F7F8F5" font-weight="700">Score</text>
      <text x="24" y="101" font-size="14" fill="#F7F8F5">Rank the opportunity.</text>
    </g>
    <path d="M610 148h55" stroke="#D99A2B" stroke-width="4"/>
    <path d="m657 139 14 9-14 9" fill="none" stroke="#D99A2B" stroke-width="4"/>
    <g transform="translate(680 88)">
      <rect width="220" height="120" rx="8" fill="#176B87"/>
      <text x="24" y="42" font-size="14" fill="#F7F8F5" font-weight="700">03</text>
      <text x="24" y="78" font-size="26" fill="#F7F8F5" font-weight="700">Validate</text>
      <text x="24" y="101" font-size="14" fill="#F7F8F5">Test the signal honestly.</text>
    </g>
    <path d="M920 148h55" stroke="#D99A2B" stroke-width="4"/>
    <path d="m967 139 14 9-14 9" fill="none" stroke="#D99A2B" stroke-width="4"/>
    <g transform="translate(990 88)">
      <rect width="150" height="120" rx="8" fill="#D99A2B"/>
      <text x="24" y="42" font-size="14" fill="#17212B" font-weight="700">04</text>
      <text x="24" y="78" font-size="26" fill="#17212B" font-weight="700">Act</text>
      <text x="24" y="101" font-size="14" fill="#17212B">Review first.</text>
    </g>
